[project]
name = "crawler"
version = "0.1.0"
description = "RC rock crawler control for a Raspberry Pi 4 -- hand driving over a Bluetooth pad, and an OAK-D auto mode."
readme = "README.md"
requires-python = "==3.11.*"

# These are the pinned, known-working aarch64 set that is on the car right now,
# read off the venv that the live service runs out of. They are pins and not
# floors on purpose: every one of these has a wheel for cp311 + linux aarch64,
# and a resolver left free to pick something newer is a resolver that can take
# the car off the road. Bumping one is a deliberate act with the wheels checked
# first, not a side effect of a sync.
#
# numpy is the one to be loudest about: numpy 2.x breaks both depthai and
# TensorFlow, and everything here is built against 1.x. ==1.26.4, not >=.
dependencies = [
    "pigpio==1.78",
    "pygame==2.6.1",
    "depthai==2.30.0.0",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "Adafruit-Blinka==8.56.0",
    "adafruit-circuitpython-pca9685==3.4.17",
    "adafruit-circuitpython-motor==3.4.15",
    # Live telemetry to Foxglove Studio. This is the official SDK, and the
    # name is worth being careful about: the package called `foxglove` on PyPI
    # is a Firefox proxy profile manager by somebody else entirely. The one I
    # want is `foxglove-sdk`, which installs as `import foxglove`.
    #
    # The other candidate was `foxglove-websocket`, the older pure-Python
    # server. Its own PyPI summary now reads "deprecated in favor of
    # foxglove-sdk", so it is out on those grounds alone -- but the thing I
    # checked first was wheels, because this one is Rust underneath and a Rust
    # package with no aarch64 wheel means cargo building on a Pi 4. It ships
    # abi3 wheels, so one build covers 3.10 and up, and the aarch64 ones are
    # there:
    #
    #   foxglove_sdk-0.30.2-cp310-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64.whl
    #   foxglove_sdk-0.30.2-cp310-abi3-manylinux_2_28_aarch64.whl
    #
    # The Pi is glibc 2.36, so either tag is satisfied and nothing compiles.
    "foxglove-sdk==0.30.2",
    # The learned driving policy's runtime, and the only one: policy.py runs
    # an exported .onnx through it, and nothing on the car imports torch.
    # Checked on the car before pinning, in a scratch venv off /usr/bin/python3
    # with numpy==1.26.4 alongside: pip picked
    #
    #   onnxruntime-1.31.1-cp311-cp311-manylinux_2_28_aarch64.whl
    #
    # and it imports and runs against numpy 1.26.4. Its own dependencies are
    # flatbuffers, packaging and protobuf.
    "onnxruntime==1.31.1",
]

[project.optional-dependencies]
# There was a `vision` extra in here -- tensorflow, tensorflow-hub,
# tflite-runtime and a setuptools<81 pin to work around tensorflow_hub
# importing pkg_resources without declaring it. It is gone, along with the
# four files that were its only consumers: PersonFollower.py, USBCamera.py,
# scratch_persondetect.py and convert_pb_to_tflite.py.
#
# Worth being clear about why, because TensorFlow looks like something a robot
# project ought to want. It was a whole-image classifier bolted to a USB
# webcam, and the car does not see that way any more -- vision is the OAK-D
# now, and depthai does stereo depth on the camera's own chip. Nothing left in
# this project has any use for a TensorFlow graph, and it was by a wide margin
# the biggest and most aarch64-fragile thing in here.
#
# `uv sync --extra vision` is not a command any more. git log has all of it if
# I ever want the pin set back.

# Deliberately empty, and the emptiness is the point.
#
# `python -m crawler --dashboard` imports PyQt5, and PyQt5 cannot be a pip dependency on
# this machine. PyQt5 5.15.x publishes no linux_aarch64 wheel -- 5.15.9 ships
# x86_64 manylinux, x86_64 macOS, win32 and win_amd64, and that is it -- so pip
# would fall back to the sdist and try to compile Qt bindings on the Pi, which
# needs the Qt5 dev headers and sip and takes hours when it works at all.
#
# So PyQt5 comes from apt:
#
#   sudo apt install python3-pyqt5
#
# which installs 5.15.9 (arm64) into /usr/lib/python3/dist-packages. A venv
# only sees that if it was created to see it, so the environment that runs
# --dashboard has to be made with:
#
#   uv venv --python /usr/bin/python3 --system-site-packages
#
# Same reason requires-python is pinned to ==3.11.* above and the interpreter
# is named explicitly: apt's PyQt5 is built for the system 3.11, and a
# uv-managed CPython would not find dist-packages at all.
dashboard = []

[dependency-groups]
# Tests. A dependency group and not an extra, because an extra is something a
# consumer installs and a group is something only this checkout needs -- and
# `uv sync` installs the dev group by default, so the tests are there without
# anybody remembering a flag. `uv sync --no-dev` on the car if I ever want it
# left out.
#
# pytest only. Everything the tests import beyond it -- numpy for the depth
# frames, and nothing else -- is already a real dependency of the project.
# Nothing in here needs pigpio talking to a daemon, a pad plugged in, or the
# OAK-D attached, which is the whole point: they run on the laptop.
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so `import crawler` is always this checkout's package, even from a venv
# that has a different checkout installed (a worktree, say). "tools" because
# the laptop tools are scripts and not a package, and the tests import them by
# name (`import policy_train as pt`).
pythonpath = [".", "tools"]
addopts = "-q"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# The car's code is the one package, crawler/, and `uv sync` installs it into
# .venv as editable. tools/, deploy/, scripts/ and tests/ are not part of it.
# The car does not depend on the install: the unit runs `python -m crawler`
# with WorkingDirectory at the checkout, and -m finds the package there.
[tool.setuptools.packages.find]
include = ["crawler", "crawler.*"]

[tool.uv]
package = true

# The Mac this is committed from is macOS arm64 with none of the car's hardware
# libraries on it, and the lock has to be good for the Pi regardless. This makes
# uv fail the lock outright if it cannot cover cp311 + linux aarch64, instead of
# quietly resolving something that only works on the laptop.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

# Not a dependency, on purpose: opencv-contrib-python is installed on the car,
# but nothing here needs it. Every cv2 call in the project -- VideoCapture,
# CAP_PROP_FPS, resize, rectangle, circle, line, putText, imwrite, imshow,
# waitKey, destroyAllWindows, accumulateWeighted, applyColorMap, normalize --
# is in the base module. There is no cv2.ximgproc, cv2.aruco, cv2.tracking or
# anything else from contrib anywhere in the tree. Installing opencv-python and
# opencv-contrib-python together is a known way to get two copies of the same
# native extension fighting over one `cv2` name, so only the base one is here.
