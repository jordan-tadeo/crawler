<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Crawler map</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#262c36;--text:#e8ecf2;--dim:#8a94a6;
--go:#16a874;--hold:#d98c0b;--blue:#3b7be0;--red:#d44848;--gold:#d9b31a;--btn:#222833;--btn2:#2b3240}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none;
font:15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right))
max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));gap:6px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);
border:1px solid var(--line);border-radius:12px;padding:4px;flex:none}
.tab{display:block;text-align:center;padding:9px 0;border-radius:9px;color:var(--dim);
text-decoration:none;font-weight:600}
.tab.on{background:var(--btn2);color:var(--text)}
.banner{flex:none;border-radius:10px;padding:8px 10px;font-size:13px;display:none;gap:8px;align-items:center}
.banner.show{display:flex}
.banner .msg{flex:1}
.banner button{min-height:36px;padding:4px 12px;font-size:13px}
#nr{background:#2a2110;border:1px solid #6b4a12;color:#ffd28a}
#nr.bad{background:#2a1414;border-color:#6b2020;color:#ff9b9b}
#nr.info{background:#141c2a;border-color:#2b4470;color:#a9c6ff}
#err{background:#2a1414;border:1px solid #6b2020;color:#ff9b9b}
#wrap{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;
background:#0a0c10;border:1px solid var(--line)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;
user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#ov{pointer-events:none}
#status{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{background:rgba(23,27,34,.88);border:1px solid var(--line);border-radius:999px;
padding:4px 10px;font-size:12px;color:var(--dim)}
.chip b{color:var(--text);font-weight:600}
.chip.warn{color:#ffd28a;border-color:#6b4a12}
.chip.bad{color:#ff9b9b;border-color:#6b2020}
.key{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 6px;vertical-align:-1px}
#side{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#side button{min-height:44px;width:44px;padding:0;font-size:20px}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:80%;
background:rgba(23,27,34,.95);border:1px solid var(--line);border-radius:10px;padding:7px 12px;
font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
#toast.warn{border-color:#6b4a12;color:#ffd28a}
#toast.bad{border-color:#6b2020;color:#ff9b9b}
.bar{display:grid;gap:6px;flex:none}
.bar.four{grid-template-columns:repeat(4,1fr)}
button{border:0;border-radius:11px;background:var(--btn);color:var(--text);font:inherit;
font-weight:600;min-height:50px;padding:6px 4px;cursor:pointer;user-select:none;
-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button:active{filter:brightness(1.4)}
button:disabled{opacity:.35}
button.on{background:#1d2a40;box-shadow:inset 0 0 0 2px var(--blue)}
button.go{background:var(--go)}button.hold{background:var(--hold)}
button.danger{color:#ff9b9b}
button .sub{display:block;font-size:11px;font-weight:500;color:var(--dim)}
#adjust{display:none}
body.adjusting #adjust{display:grid}
body.adjusting #main{display:none}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet.show{display:flex}
#sheet .in{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;
max-width:520px;max-height:80%;overflow:auto;padding:14px 14px max(14px,env(safe-area-inset-bottom))}
#sheet h2{font-size:13px;margin:4px 2px 10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim)}
#sheet .row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
#sheet .row .nm{flex:1;padding:10px;background:var(--btn);border-radius:10px;text-align:left}
#sheet .row button{min-height:44px}
#sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
#sheet .empty{color:var(--dim);font-size:13px;padding:6px 2px 12px}
</style>
</head>
<body>
<nav class="tabs"><a class="tab" href="/">Buttons</a><a class="tab on" href="/map">Map</a></nav>
<div class="banner" id="nr"><span class="msg" id="nr_msg"></span></div>
<div class="banner" id="err"><span class="msg" id="err_msg"></span><button id="e_retry">Retry</button><button id="e_drop">Discard</button></div>
<div id="wrap">
<canvas id="cv"></canvas>
<canvas id="ov"></canvas>
<div id="status"><span class="chip" id="c_conn">Connecting</span><span class="chip" id="c_track"></span><span class="chip" id="c_fit"></span><span class="chip" id="c_key"><span class="key" style="background:#444e5e"></span>free<span class="key" style="background:#ebebeb"></span>wall<span class="key" style="background:#0a0c10;box-shadow:inset 0 0 0 1px #3a4250"></span>unknown</span></div>
<div id="side">
<button id="b_zin" title="Zoom in">+</button>
<button id="b_zout" title="Zoom out">&minus;</button>
<button id="b_ctr" title="Centre on the truck">&#9678;</button>
</div>
<div id="toast"></div>
</div>
<div class="bar four" id="main">
<button id="b_draw">Draw<span class="sub">off: pan</span></button>
<button id="b_unstroke">Undo<span class="sub">last stroke</span></button>
<button id="b_del" disabled>Delete<span class="sub">waypoint</span></button>
<button id="b_menu">Track<span class="sub">save, load</span></button>
<button id="b_run" class="go">Start</button>
<button id="b_explore">Explore<span class="sub">off</span></button>
<button id="b_skip">Skip<span class="sub">stuck: off</span></button>
<button id="b_adj">Nudge<span class="sub">turn or shift</span></button>
</div>
<div class="bar four" id="adjust">
<button id="a_ccw">&#8634;<span class="sub">2&deg;</span></button>
<button id="a_cw">&#8635;<span class="sub">2&deg;</span></button>
<button id="a_ok" class="go">Place</button>
<button id="a_no">Cancel</button>
</div>
<div id="sheet"><div class="in" id="sheetin"></div></div>
<script>
(function(){
"use strict";
// Every distance below is in map metres unless it says px.
var SPACING_M=1.0;          // a waypoint every this much of a drawn stroke
var LONG_MS=450;            // hold this long without moving to pick up a waypoint
var SLOP_PX=10;             // a finger moving less than this is still holding
var HIT_PX=30;              // a waypoint within this of a finger is under it
var DOT_PX=11;              // waypoint marker radius
var POLL_MS=500, MAP_MS=1000;
var ACK_MS=5000;            // a command the car has not answered in this is not taken
var STALE_S=3;
var ROT_STEP=2*Math.PI/180;

var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var ov=document.getElementById("ov"),octx=ov.getContext("2d");
var $=function(id){return document.getElementById(id);};
var st=null;                // the last /api/state, as the car sent it: never edited here
var net=null;               // why the last poll failed, or null
var map=null;               // {img, x0, y0, res, nx, ny, codes: Uint8Array, tag}
var view={cx:0,cy:0,s:40};  // world centre, px per metre (css px)
var centred=false;
var drawMode=false,sel=-1,xon=false; // xon: exploring
var stroke=null;            // the live stroke {pts, drops, acc, drawn, dots}
var edits=[];               // sent, not answered yet, or not taken: {id, cmd, body, state, at, why}
var drag=null;              // {i, x, y} a waypoint being moved
var adj=null;               // {kind:"pending"|"nudge", T:[yaw,x,y], pts, walls}
var pendingWalls={id:null,walls:[]};
var dpr=1, down=0, pollsSinceUp=9, gotAt=0;
var page=Math.random().toString(36).slice(2,8), seq=0;
// Counters and a read-only look at what is on screen, for the page's tests.
var stats=window.__mapStats={draws:0,overlay:0,polls:0,mapDecodes:0,
  shown:function(){return shown();},
  // Where a map point is on the phone's screen, in client px: the drawing's
  // px scaled to the box the browser shows it in.
  screen:function(x,y){var s=toS(x,y),r=cv.getBoundingClientRect();
    return [r.left+s[0]*r.width/W(),r.top+s[1]*r.height/H()];},
  edits:function(){return edits.map(function(e){return {cmd:e.cmd,state:e.state,why:e.why};});}};

function toast(msg,kind){var t=$("toast");t.textContent=msg;t.className="show "+(kind||"");
  clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=kind||"";},3500);}

// ---- commands: sent once, kept here until the car says it took them ----
function send(cmd,extra){
  var e={id:page+"-"+(++seq),cmd:cmd,body:Object.assign({cmd:cmd},extra||{}),state:"sent",at:Date.now(),why:"",tries:0};
  edits.push(e);post(e);return e;
}
function post(e){
  // A fresh id each time it goes: the car's answer to an earlier try is
  // still in its acks, and must not be read as the answer to this one.
  if(e.tries++)e.id=page+"-"+(++seq);
  e.state="sent";e.at=Date.now();e.why="";e.body.id=e.id;
  fetch("/api/cmd",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(e.body)})
    .then(function(r){return r.json().catch(function(){return {ok:false,why:"HTTP "+r.status};});})
    .then(function(j){if(!j.ok)fail(e,j.why||"refused");})
    .catch(function(){fail(e,"no connection to the car");});
  errBar();
}
// Only a stroke is kept on screen with a Retry when the car does not take
// it: it is the finger's work, and sending it again is safe. Anything else
// (Undo, Delete, a move, Start...) refused is said once and dropped. A
// refused Undo kept with a Retry was sent again later, after the next loop
// was drawn, and took that loop back.
function fail(e,why){if(edits.indexOf(e)<0||e.state==="failed")return;
  if(e.cmd!=="stroke"){edits.splice(edits.indexOf(e),1);toast(why,"warn");}
  else{e.state="failed";e.why=why;}errBar();schedule();}
function answer(){
  // Each edit the car has answered (patrol.acks, [id, taken, why]) is gone
  // from here when taken: it is in the state now. Not taken, a stroke stays
  // on screen with a Retry. A stroke given up on for no answer that the car
  // then does take is gone too, not shown twice.
  var acks={};((st&&st.patrol&&st.patrol.acks)||[]).forEach(function(a){acks[a[0]]=a;});
  var now=Date.now(),changed=false,refused=[];
  edits=edits.filter(function(e){
    var a=acks[e.id];
    if(a&&a[1]){changed=true;return false;}
    if(e.state!=="sent")return true;
    if(a){changed=true;refused.push([e,refusal(e,a)]);return true;}
    // No answer: only once the car has sent fresh state for ACK_MS since it
    // went. While a finger is down the page does not poll at all, so the
    // clock alone would give up on a stroke the car took long ago.
    if(now-e.at>ACK_MS&&gotAt-e.at>ACK_MS){changed=true;refused.push([e,"no answer in "+ACK_MS/1000+" s"]);}
    return true;});
  refused.forEach(function(r){fail(r[0],r[1]);});
  if(changed)errBar();
}
function refusal(e,a){
  // The car's own reason (a car from before acks carried one: its last warning).
  if(a[2])return a[2];
  var s=(st&&st.patrol&&st.patrol.said)||[];
  for(var i=s.length-1;i>=0;i--)if(s[i][0]==="warning")return s[i][1];
  return e.cmd.charAt(0).toUpperCase()+e.cmd.slice(1)+" refused";}
function errBar(){
  var bad=edits.filter(function(e){return e.state==="failed";}),b=$("err");
  if(!bad.length){b.classList.remove("show");return;}
  var e=bad[bad.length-1],n=e.body.points.length;
  $("err_msg").textContent="Car didn't take "+(bad.length>1?bad.length+" strokes":"the stroke of "+n+" waypoint"+(n>1?"s":""))
    +": "+e.why.replace(/\.$/,"")+". Retry sends it again, Discard drops it.";
  b.classList.add("show");
}
$("e_retry").onclick=function(){edits.forEach(function(e){if(e.state==="failed")post(e);});schedule();};
$("e_drop").onclick=function(){edits=edits.filter(function(e){return e.state!=="failed";});errBar();schedule();};

// ---- view ----
var hatch=null;
// The canvas is the map box, and the box changes height without the window
// resizing: a banner above it (no controller, not ready, an error) comes and
// goes. With only the window's resize the drawing kept its old height
// stretched into the new box, so a waypoint showed up to a banner's height
// above the finger that put it there. The box is watched instead.
function resize(){dpr=window.devicePixelRatio||1;var r=cv.getBoundingClientRect();
  if(!r.width||!r.height)return;
  if(cv.width===Math.round(r.width*dpr)&&cv.height===Math.round(r.height*dpr)&&hatch)return;
  cv.width=ov.width=Math.round(r.width*dpr);cv.height=ov.height=Math.round(r.height*dpr);
  var h=document.createElement("canvas");h.width=h.height=Math.round(10*dpr);var g=h.getContext("2d");
  g.fillStyle="#0a0c10";g.fillRect(0,0,h.width,h.height);g.strokeStyle="#1b2029";g.lineWidth=dpr;
  g.beginPath();g.moveTo(0,h.height);g.lineTo(h.width,0);g.stroke();hatch=ctx.createPattern(h,"repeat");
  // A stroke being drawn lost its overlay with the resize: draw it again.
  if(stroke){stroke.drawn=0;stroke.dots=0;overlay();}
  schedule();}
function W(){return cv.width/dpr;}function H(){return cv.height/dpr;}
function toS(x,y){return [(x-view.cx)*view.s+W()/2,H()/2-(y-view.cy)*view.s];}
function toW(px,py){return [(px-W()/2)/view.s+view.cx,view.cy-(py-H()/2)/view.s];}
function zoomAt(f,px,py){var a=toW(px,py);view.s=Math.max(4,Math.min(400,view.s*f));
  var b=toW(px,py);view.cx+=a[0]-b[0];view.cy+=a[1]-b[1];schedule();}

function T(tr,p){var c=Math.cos(tr[0]),s=Math.sin(tr[0]);
  return [c*p[0]-s*p[1]+tr[1],s*p[0]+c*p[1]+tr[2]];}

// ---- the waypoints the page shows ----
function points(){return st&&st.patrol&&st.patrol.points?st.patrol.points:[];}
function shown(){
  // [[x,y]|null]: the car's list, with every edit it has not taken yet on top.
  var p=points().slice();
  edits.forEach(function(e){var b=e.body;
    if(e.cmd==="stroke")b.points.forEach(function(q){p.push(q);});
    else if(e.cmd==="move"&&p[b.i])p[b.i]=[b.x,b.y];
    else if(e.cmd==="delete"&&b.i<p.length)p[b.i]=null;});
  if(drag&&p[drag.i])p[drag.i]=[drag.x,drag.y];
  if(adj&&adj.kind==="nudge")p=adj.pts.map(function(q){return q&&T(adj.T,q);});
  return p;
}
function loopMode(){return !st||!st.patrol||st.patrol.mode!=="once";}
function hit(px,py){var p=points(),best=-1,bd=HIT_PX;
  for(var i=0;i<p.length;i++){if(!p[i])continue;var s=toS(p[i][0],p[i][1]);
    var d=Math.hypot(s[0]-px,s[1]-py);if(d<bd){bd=d;best=i;}}return best;}
function occupied(x,y){
  if(!map||!map.codes)return false;
  var i=Math.floor((x-map.x0)/map.res),j=Math.floor((y-map.y0)/map.res);
  if(i<0||j<0||i>=map.nx||j>=map.ny)return false;
  return map.codes[(map.ny-1-j)*map.nx+i]===2;}

// ---- the estimated drive line ----
// Straight between waypoints, each corner rounded to the truck's turning
// radius. Where the legs are too short for that circle (or the corner is a
// hairpin) the corner is drawn with the circle that fits, in red: the truck
// cannot follow it as drawn. Worked out again only when the waypoints change.
function driveLine(p,closed,R){
  var q=p.filter(function(a){return a;});var n=q.length;
  if(n<2||!R)return null;
  var corners=[];
  var idx=function(i){return (i+n)%n;};
  for(var i=0;i<n;i++){
    if(!closed&&(i===0||i===n-1)){corners.push(null);continue;}
    var a=q[idx(i-1)],b=q[i],c=q[idx(i+1)];
    var l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]);
    if(l1<1e-6||l2<1e-6){corners.push(null);continue;}
    var u=[(b[0]-a[0])/l1,(b[1]-a[1])/l1],v=[(c[0]-b[0])/l2,(c[1]-b[1])/l2];
    var th=Math.acos(Math.max(-1,Math.min(1,u[0]*v[0]+u[1]*v[1])));
    if(th<1e-3){corners.push(null);continue;}
    var room=Math.min(closed||i>1?l1/2:l1,closed||i<n-2?l2/2:l2);
    var t=R*Math.tan(th/2),r=R,bad=false;
    if(th>150*Math.PI/180||t>room){bad=true;t=Math.min(t,room);r=t/Math.tan(th/2);}
    corners.push({b:b,u:u,v:v,t:t,r:r,bad:bad});
  }
  return {q:q,corners:corners,closed:closed,bad:corners.filter(function(c){return c&&c.bad;}).length};
}
var lineKey=null,lineMemo=null;
function driveLineOf(p,closed,R){var k=JSON.stringify(p)+closed+R;
  if(k!==lineKey){lineKey=k;lineMemo=driveLine(p,closed,R);stats.lines=(stats.lines||0)+1;}return lineMemo;}
function strokeLine(L){
  var q=L.q,n=q.length,cs=L.corners;
  var start=L.closed?[(q[0][0]+q[1][0])/2,(q[0][1]+q[1][1])/2]:q[0];
  var s=toS(start[0],start[1]);ctx.beginPath();ctx.moveTo(s[0],s[1]);
  var order=[];for(var i=1;i<n;i++)order.push(i);if(L.closed)order.push(0);
  order.forEach(function(i){var c=cs[i];var b=q[i];
    if(c){var nx=q[(i+1)%n],B=toS(b[0],b[1]),N=toS(nx[0],nx[1]);ctx.arcTo(B[0],B[1],N[0],N[1],c.r*view.s);}
    else{var B2=toS(b[0],b[1]);ctx.lineTo(B2[0],B2[1]);}});
  if(L.closed)ctx.lineTo(s[0],s[1]);
  ctx.stroke();
  // The corners it cannot drive, again in red.
  ctx.save();ctx.setLineDash([]);ctx.strokeStyle="#ff5a5a";ctx.lineWidth=4;
  cs.forEach(function(c){if(!c||!c.bad)return;
    var a=[c.b[0]-c.u[0]*c.t,c.b[1]-c.u[1]*c.t],e=[c.b[0]+c.v[0]*c.t,c.b[1]+c.v[1]*c.t];
    var A=toS(a[0],a[1]),B=toS(c.b[0],c.b[1]),E=toS(e[0],e[1]);
    ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.arcTo(B[0],B[1],E[0],E[1],Math.max(c.r*view.s,0.5));ctx.lineTo(E[0],E[1]);ctx.stroke();});
  ctx.restore();
}

// ---- drawing ----
// The whole picture, at most once a frame and never while a stroke is being
// drawn: the live stroke goes on its own canvas (ov), a segment at a time.
var queued=false;
function schedule(){if(queued)return;queued=true;requestAnimationFrame(function(){queued=false;
  if(stroke)return;draw();});}
function draw(){
  stats.draws++;
  var w=W(),h=H();ctx.setTransform(dpr,0,0,dpr,0,0);
  // Unknown is hatched, everywhere the map has not seen.
  ctx.fillStyle=hatch||"#0a0c10";ctx.fillRect(0,0,w,h);
  if(map&&map.img){var tl=toS(map.x0,map.y0+map.ny*map.res);
    ctx.imageSmoothingEnabled=false;ctx.drawImage(map.img,tl[0],tl[1],map.nx*map.res*view.s,map.ny*map.res*view.s);}
  // A saved track not placed yet: its walls and waypoints where the nudge has them.
  if(adj&&adj.kind==="pending"){ctx.fillStyle="rgba(255,170,60,.85)";
    var sz=Math.max(2,0.08*view.s);
    adj.walls.forEach(function(q){var s=T(adj.T,q),S=toS(s[0],s[1]);ctx.fillRect(S[0]-sz/2,S[1]-sz/2,sz,sz);});}
  var p=adj&&adj.kind==="pending"?adj.pts.map(function(q){return T(adj.T,q);}):shown();
  // The drive line, under the waypoints.
  var R=st&&st.turn_radius_m,bad=0;
  var L=drag?null:driveLineOf(p,loopMode(),R);
  if(L){ctx.save();ctx.setLineDash([2,6]);ctx.lineCap="round";ctx.lineWidth=3;
    ctx.strokeStyle="rgba(120,200,255,.9)";strokeLine(L);bad=L.bad;ctx.restore();}
  // The planner's path and the point it feeds.
  if(st&&st.path&&st.path.length>1){ctx.save();ctx.strokeStyle="rgba(22,168,116,.8)";ctx.lineWidth=2;
    ctx.beginPath();st.path.forEach(function(q,i){var s=toS(q[0],q[1]);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]);});
    ctx.stroke();ctx.restore();}
  if(st&&st.aim){var A=toS(st.aim[0],st.aim[1]);ctx.fillStyle="#16a874";ctx.beginPath();ctx.arc(A[0],A[1],5,0,7);ctx.fill();}
  var ex=xon&&st.patrol.explore.target;
  if(ex){var E=toS(ex[0],ex[1]);ctx.strokeStyle="#e0a030";ctx.lineWidth=3;ctx.beginPath();ctx.arc(E[0],E[1],10,0,7);ctx.stroke();}

      var px=o.getImageData(0,0,hdr[3],hdr[4]).data,codes=new Uint8Array(hdr[3]*hdr[4]);
      for(var i=0;i<codes.length;i++)codes[i]=px[i*4+3]===0?0:(px[i*4]>200?2:1);
      map={img:img,x0:hdr[0],y0:hdr[1],res:hdr[2],nx:hdr[3],ny:hdr[4],codes:codes,tag:tag};
      schedule();});
  }).catch(function(){});
}
document.addEventListener("visibilitychange",function(){if(!document.hidden){pollState();pollMap();}});
window.addEventListener("resize",resize);
if(window.ResizeObserver)new ResizeObserver(function(){resize();}).observe($("wrap"));
setInterval(pollState,POLL_MS);setInterval(pollMap,MAP_MS);
setInterval(function(){if(edits.length){answer();schedule();}},1000);
resize();pollState();pollMap();
})();
</script>
